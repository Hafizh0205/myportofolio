{% extends "base.html" %}
{% block meta %}
<title>Add Project - {{ name }}</title>
{% endblock meta %}

{% block content %}
<main>
    <section class="experience-section">
        <div class="container">
            <article class="edu-card in-view" style="padding: 2rem; max-width: 650px; margin: 0 auto;">
                <h1 style="font-family: 'Space Grotesk', sans-serif; margin-bottom: 1.5rem; font-size: 1.8rem;">Add New Projects</h1>
                
                <form method="post" action="{% url 'main:create_project' %}" class="project-form">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="form-group" style="margin-bottom: 1.25rem;">
                            <label for="{{ field.id_for_label }}" style="display: block; margin-bottom: 0.4rem; font-weight: 600; font-size: 0.9rem;">{{ field.label }}</label>
                            {{ field }}
                            {% for error in field.errors %}
                                <p class="form-error" style="color: var(--accent-red); font-size: 0.85rem; margin-top: 0.35rem;">{{ error }}</p>
                            {% endfor %}
                        </div>
                    {% endfor %}
                    
                    <div style="display: flex; gap: 0.75rem; margin-top: 1.5rem;">
                        <button type="submit" class="social-link">Tambah Project</button>
                        <a href="{% url 'main:show_projects' %}" class="social-link" style="background: rgba(55, 65, 81, 0.4);">Batal</a>
                    </div>
                </form>
            </article>
        </div>
    </section>
</main>
{% endblock content %}
